<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VantaOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body { background-color: #0a0a0c; margin: 0; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.95); } }
      @keyframes glow { 0%, 100% { text-shadow: 0 0 10px rgba(99,102,241,0.5); } 50% { text-shadow: 0 0 20px rgba(99,102,241,0.9); } }
    </style>
  </head>
  <body>
    <div id="loader" style="position:fixed;inset:0;background:#0a0a0c;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.6s ease;flex-direction:column;gap:24px;">
      <div style="position:relative;width:80px;height:80px;">
        <div style="position:absolute;inset:0;border:2px solid transparent;border-top-color:#6366f1;border-radius:50%;animation:spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
        <div style="position:absolute;inset:10px;border:2px solid transparent;border-right-color:#818cf8;border-radius:50%;animation:spin 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;"></div>
        <div style="position:absolute;inset:20px;border:2px solid transparent;border-bottom-color:#a5b4fc;border-radius:50%;animation:spin 2.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
      </div>
      <div style="color:#818cf8;font-family:ui-sans-serif, system-ui, sans-serif;font-weight:900;letter-spacing:6px;animation:glow 2s ease-in-out infinite;font-size:14px;">VANTA.OS</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 600);
          }
        }, 800);
      });
    </script>
  </body>
</html>
