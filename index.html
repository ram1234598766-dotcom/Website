<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thessvar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="loader" style="position:fixed;inset:0;background:#0f172a;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease;flex-direction:column;gap:20px;">
      <div style="position:relative;width:80px;height:80px;">
        <div style="position:absolute;inset:0;border:4px solid transparent;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="position:absolute;inset:10px;border:4px solid transparent;border-right-color:#3b82f6;border-radius:50%;animation:spin 1.5s linear infinite reverse;"></div>
        <div style="position:absolute;inset:20px;border:4px solid transparent;border-bottom-color:#8b5cf6;border-radius:50%;animation:spin 2s linear infinite;"></div>
        <img src="/favicon.svg" style="position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);width:24px;height:24px;animation:pulse 2s ease-in-out infinite;" />
      </div>
      <div style="color:#10b981;font-family:monospace;font-weight:bold;letter-spacing:4px;animation:pulse 2s ease-in-out infinite;">THESSVAR.OS</div>
    </div>
    <style>
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('loader');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
